@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600&display=swap');
:root{
  --cobalt:#1A365D;--cobalt-deep:#001F3F;--azur:#00AEEF;--azur-dark:#0090CC;
  --or:#C5A059;--blanc:#FFFFFF;--gray:#8B9DB8;--success:#00C896;--danger:#FF6B6B;
  --navy:#001F3F;--blue:#1A365D;--card-bg:rgba(255,255,255,0.05);
  --border:rgba(0,174,239,0.18);--shadow:0 20px 60px rgba(26,54,93,0.4);
  --font-d:'Montserrat',Arial,sans-serif;--font-b:'Poppins',Arial,sans-serif;
  --radius:16px;--radius-sm:8px;--tr:0.3s ease;
}
[data-theme="light"]{--navy:#E8F4FB;--blue:#F0F8FF;--card-bg:rgba(0,102,255,0.06);
  --border:rgba(26,54,93,0.15);--blanc:#1A365D;--gray:#4A5568;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-b);background:var(--navy);color:var(--blanc);overflow-x:hidden;line-height:1.6;}
h1,h2,h3,h4,h5{font-family:var(--font-d);line-height:1.2;}
h1{font-size:clamp(1.9rem,5vw,3.8rem);font-weight:800;}
h2{font-size:clamp(1.6rem,3.5vw,2.6rem);font-weight:700;}
h3{font-size:clamp(1rem,2vw,1.4rem);font-weight:600;}
p{font-family:var(--font-b);color:var(--gray);line-height:1.75;}
a{text-decoration:none;color:inherit;}
img{max-width:100%;height:auto;}
.container{max-width:1200px;margin:0 auto;padding:0 1.5rem;}
.section{padding:5rem 0;}
.text-center{text-align:center;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.8rem;border-radius:50px;
  font-family:var(--font-d);font-weight:600;font-size:.88rem;cursor:pointer;border:none;
  transition:all var(--tr);text-decoration:none;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--cobalt),var(--azur));color:#fff;box-shadow:0 8px 30px rgba(26,54,93,.35);}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,174,239,.45);}
.btn-outline{background:transparent;color:var(--azur);border:1.5px solid var(--azur);}
.btn-outline:hover{background:var(--azur);color:var(--cobalt-deep);}
.btn-ghost{background:var(--card-bg);color:var(--blanc);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--azur);color:var(--azur);}
.btn-gold{background:linear-gradient(135deg,var(--or),#8B6A30);color:#fff;}
.btn-gold:hover{transform:translateY(-3px);}
.btn-danger{background:rgba(255,107,107,.15);color:#ff8a8a;border:1px solid rgba(255,107,107,.3);}
.btn-sm{padding:.5rem 1.2rem;font-size:.8rem;}

/* Badges */
.badge{display:inline-block;padding:.3rem 1rem;border-radius:50px;font-size:.72rem;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(0,174,239,.15);color:var(--azur);border:1px solid rgba(0,174,239,.3);}
.section-header{margin-bottom:3rem;}
.section-header h2{margin:.5rem 0 .75rem;}
.section-header p{max-width:560px;margin:0 auto;}
.divider{width:50px;height:3px;margin:.75rem auto;background:linear-gradient(135deg,var(--cobalt),var(--azur));border-radius:2px;}

/* Animations */
.fade-in,.slide-up,.slide-left,.slide-right{opacity:0;transition:opacity .7s ease,transform .7s ease;}
.fade-in{transform:translateY(28px);}
.slide-up{transform:translateY(50px);}
.slide-left{transform:translateX(-50px);}
.slide-right{transform:translateX(50px);}
.fade-in.visible,.slide-up.visible,.slide-left.visible,.slide-right.visible{opacity:1;transform:none;}
.d1{transition-delay:.1s;}.d2{transition-delay:.2s;}.d3{transition-delay:.3s;}
.d4{transition-delay:.4s;}.d5{transition-delay:.5s;}.d6{transition-delay:.6s;}

/* NAVBAR */
.navbar{position:fixed;top:0;left:0;right:0;z-index:9999;padding:1rem 0;transition:all var(--tr);}
.navbar.scrolled{background:rgba(0,31,63,.97);backdrop-filter:blur(20px);
  box-shadow:0 4px 30px rgba(0,0,0,.3);padding:.65rem 0;border-bottom:1px solid var(--border);}
.nav-container{display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.nav-logo-img{height:44px;width:auto;min-width:150px;object-fit:contain;display:block;}
.nav-links{display:flex;align-items:center;gap:.1rem;}
.nav-link{padding:.45rem .85rem;border-radius:var(--radius-sm);font-size:.85rem;font-weight:500;
  color:rgba(255,255,255,.8);transition:all var(--tr);display:inline-block;}
.nav-link:hover,.nav-link.active{color:#fff;background:rgba(0,174,239,.15);}
.nav-actions{display:flex;align-items:center;gap:.5rem;}
.nav-user{display:none;align-items:center;gap:.6rem;}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--cobalt),var(--azur));
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff;}

/* Hamburger */
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;
  border-radius:8px;background:rgba(255,255,255,.08);border:1px solid var(--border);
  transition:all var(--tr);}
.hamburger span{display:block;width:22px;height:2px;background:#fff;border-radius:2px;transition:all .3s;}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.active span:nth-child(2){opacity:0;transform:translateX(-10px);}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}

/* Mobile menu */
.mobile-menu{display:none;position:fixed;inset:0;z-index:9998;
  background:rgba(0,31,63,.98);backdrop-filter:blur(20px);
  flex-direction:column;align-items:center;justify-content:center;

function getLang(){return localStorage.getItem('lld_lang')||'fr';}
function setLang(l){localStorage.setItem('lld_lang',l);location.reload();}
function applyTranslations(){
  var t=translations[getLang()]||translations.fr;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k=el.getAttribute('data-i18n');
    if(t[k])el.textContent=t[k];
  });
}

/* ── Theme ── */
function getTheme(){return localStorage.getItem('lld_theme')||'dark';}
function setTheme(th){
  localStorage.setItem('lld_theme',th);
  document.documentElement.setAttribute('data-theme',th);
  document.querySelectorAll('.theme-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.theme===th);
  });
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',getTheme());
}

/* ── Auth ── */
function getUsers(){try{return JSON.parse(localStorage.getItem('lld_users')||'[]');}catch(e){return[];}}
function saveUsers(u){localStorage.setItem('lld_users',JSON.stringify(u));}
function getCurrentUser(){try{return JSON.parse(localStorage.getItem('lld_current_user')||'null');}catch(e){return null;}}
function login(email,password){
  var users=getUsers();
  var user=users.find(function(u){return u.email===email&&u.password===btoa(password);});
  if(!user)return{success:false,message:'Email ou mot de passe incorrect.'};
  localStorage.setItem('lld_current_user',JSON.stringify(user));
  return{success:true,user:user};
}
function logout(){
  localStorage.removeItem('lld_current_user');
  window.location.href='index.html';
}
function register(name,email,password){
  var users=getUsers();
  if(users.find(function(u){return u.email===email;}))return{success:false,message:'Cet email est deja utilise.'};
  var user={id:Date.now(),name:name,email:email,password:btoa(password),avatar:name.charAt(0).toUpperCase()};
  users.push(user);saveUsers(users);
  localStorage.setItem('lld_current_user',JSON.stringify(user));
  return{success:true,user:user};
}

/* ── Toast ── */
function showToast(msg,type){
  var t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;t.className='toast'+(type==='error'?' toast-error':'');
  setTimeout(function(){t.classList.add('show');},10);
  setTimeout(function(){t.classList.remove('show');},3500);
}

/* ── Nav user state ── */
function updateNavUser(){
  var u=getCurrentUser();
  var lb=document.getElementById('nav-login-btn');
  var rb=document.getElementById('nav-register-btn');
  var ld=document.getElementById('nav-logout-btn');
  var av=document.getElementById('nav-avatar');
  var un=document.getElementById('nav-user-name');
  if(u){
    if(lb)lb.style.display='none';
    if(rb)rb.style.display='none';
    if(ld)ld.style.display='flex';
    if(av)av.textContent=u.avatar||u.name.charAt(0).toUpperCase();
    if(un)un.textContent=u.name;
  }else{
    if(lb)lb.style.display='';
    if(rb)rb.style.display='';
    if(ld)ld.style.display='none';
  }
}

/* ── Hamburger ── */
function initHamburger(){
  var btn=document.getElementById('hamburger');
  var menu=document.getElementById('mobile-menu');
  if(!btn||!menu)return;
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    var open=menu.classList.contains('open');
    if(open){menu.classList.remove('open');btn.classList.remove('active');}
    else{menu.classList.add('open');btn.classList.add('active');}
  });
  document.addEventListener('click',function(e){
    if(menu.classList.contains('open')&&!menu.contains(e.target)&&!btn.contains(e.target)){
      menu.classList.remove('open');btn.classList.remove('active');
    }
  });
}

/* ── Scroll nav ── */
function initNavScroll(){
  var nav=document.getElementById('main-nav');
  if(!nav)return;
  function check(){nav.classList.toggle('scrolled',window.scrollY>60);}
  window.addEventListener('scroll',check,{passive:true});
  check();
}

/* ── Animations ── */
function initScrollAnim(){
  var els=document.querySelectorAll('.fade-in,.slide-up,.slide-left,.slide-right');
  if(!els.length||!window.IntersectionObserver)return;
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('visible');});
  },{threshold:0.08,rootMargin:'0px 0px -30px 0px'});
  els.forEach(function(el){obs.observe(el);});
}

/* ── Counters ── */
function initCounters(){
  var els=document.querySelectorAll('.counter');
  if(!els.length||!window.IntersectionObserver)return;
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting)return;
      var el=e.target,target=parseInt(el.dataset.target),suffix=el.dataset.suffix||'',start=0;
      var step=Math.max(1,Math.ceil(target/50));
      var timer=setInterval(function(){
        start+=step;if(start>=target){start=target;clearInterval(timer);}
        el.textContent=start+suffix;
      },30);
      obs.unobserve(el);
    });
  },{threshold:0.5});
  els.forEach(function(el){obs.observe(el);});
}

/* ── FAQ ── */
function initFaq(){
  document.querySelectorAll('.faq-question').forEach(function(q){
    q.addEventListener('click',function(){
      var item=q.closest('.faq-item');
      var wasOpen=item.classList.contains('open');
      document.querySelectorAll('.faq-item').forEach(function(i){i.classList.remove('open');});
      if(!wasOpen)item.classList.add('open');
    });
  });
}

  var canvas=document.getElementById('particles-canvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var W=canvas.width=canvas.offsetWidth;
  var H=canvas.height=canvas.offsetHeight;
  var dots=[];
  for(var i=0;i<40;i++){
    dots.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.5,
      vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,
      a:Math.random()*0.4+0.1});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    dots.forEach(function(d){
      ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle='rgba(0,174,239,'+d.a+')';ctx.fill();
      d.x+=d.vx;d.y+=d.vy;
      if(d.x<0)d.x=W;if(d.x>W)d.x=0;
      if(d.y<0)d.y=H;if(d.y>H)d.y=0;
    });
    requestAnimationFrame(draw);
  }
  draw();
}

function doLogin(){
  var email=document.getElementById('login-email').value.trim();
  var pass=document.getElementById('login-pass').value;
  var err=document.getElementById('login-err');
  err.classList.remove('show');
  if(!email||!pass){err.textContent='Veuillez remplir tous les champs.';err.classList.add('show');return;}
  var r=login(email,pass);
  if(r.success){showToast('Connexion reussie !');setTimeout(function(){window.location.href='index.html';},800);}
  else{err.textContent=r.message;err.classList.add('show');}
}
document.addEventListener('DOMContentLoaded',function(){
  applyTheme();
  if(getCurrentUser())window.location.href='index.html';
});
